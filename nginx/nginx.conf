user  nginx;
# Un solo worker: con "auto" cada worker (uno por CPU del host) mantiene su
# propio contador de round-robin, y con pocas requests casi todas caen en
# workers recien despertados que arrancan siempre en el primer server,
# ocultando el balanceo. Con un worker el round-robin se ve real.
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    upstream backend {
        server api1:8000 max_fails=2 fail_timeout=10s;
        server api2:8000 max_fails=2 fail_timeout=10s;
        server api3:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts cortos para que un backend colgado (ej: contenedor
            # pausado, que acepta la conexion TCP pero nunca responde) se
            # detecte rapido en vez de esperar los 60s por default.
            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location / {
            proxy_pass http://web:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
