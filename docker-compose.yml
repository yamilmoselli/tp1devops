services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend

  api1:
    build: ./app
    image: fastapi-replica:1.0.0
    environment:
      - REPLICA_ID=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - backend

  api2:
    image: fastapi-replica:1.0.0
    environment:
      - REPLICA_ID=2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - api1
    networks:
      - backend

  api3:
    image: fastapi-replica:1.0.0
    environment:
      - REPLICA_ID=3
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - api1
    networks:
      - backend

  web:
    build: ./web
    image: fulbito5-web:latest
    networks:
      - backend

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
      - web
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  redis-data:
