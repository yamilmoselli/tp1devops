version: '3.8'

services:
  api1:
    build: ./app
    image: fastapi-replica:latest
    environment:
      - REPLICA_ID=1
    networks:
      - backend

  api2:
    build: ./app
    image: fastapi-replica:latest
    environment:
      - REPLICA_ID=2
    networks:
      - backend

  api3:
    build: ./app
    image: fastapi-replica:latest
    environment:
      - REPLICA_ID=3
    networks:
      - backend

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    networks:
      - backend

networks:
  backend:
    driver: bridge
